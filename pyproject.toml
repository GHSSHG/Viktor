[project]
name = "viktor"
version = "0.1.0"
description = "Nanopore basecaller: Dorado SUP encoder + small decoder-only LM"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.5"]
data = ["pod5", "numpy"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["viktor"]
